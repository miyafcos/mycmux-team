[[hooks.SessionEnd]]
  [[hooks.SessionEnd.hooks]]
  type = "command"
  command = 'python "C:/Users/miyaz/.mycmux/hooks/v1/mycmux_hook.py" --provider grok --event-kind session_terminated'
  timeout = 1
