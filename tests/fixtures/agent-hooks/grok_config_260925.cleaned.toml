  mycmux_managed = true

[[hooks.StopFailure]]
  [[hooks.StopFailure.hooks]]
  type = "command"
  command = 'python "C:/Users/miyaz/.mycmux/hooks/v1/mycmux_hook.py" --provider grok --event-kind failed'
