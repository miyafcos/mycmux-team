[package]
name = "mycmux"
version = "0.75.0"
description = "mycmux - AI agent terminal workspace"
authors = ["miyafcos"]
edition = "2021"

[lib]
name = "mycmux_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Test-only socket commands that let scripts drive a real window (src/e2e.rs).
# Off in every shipped build; the commands also refuse to answer outside
# `--profile`.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.5.0"
kuchikiki = "=0.8.8-speedreader"
# Markdown for the preview pane. Pinned: the renderer's AST pass and the
# sanitiser around it are written against this exact node set. The default
# features are the CLI, syntax highlighting and a builder macro, none of which
# this app uses.
comrak = { version = "=0.55.0", default-features = false }
# Text preview decoding. Japanese .txt files off Windows are routinely
# Shift_JIS, and read_to_string refuses them outright. Already in the lock
# file through other crates, so promoting it here downloads nothing new.
encoding_rs = "0.8"
quick-xml = "0.38.4"
zip = "4.6.1"
flate2 = "1.1.9"
imagesize = "0.13"
portable-pty = "0.8"
dashmap = "6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.38.4"
dirs = "6.0.0"
# Windows path canonicalisation without the \\?\ prefix. Chromium refuses to
# create its cookie database under an extended-length user data folder, which
# is how every web pane login used to be lost on restart.
dunce = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
# Session index for 続きから / Ctrl+P. Vendored from the crsm repository rather
# than shelling out to the CLI, which a macOS GUI app never finds: launchd hands
# it a minimal PATH. See crates/crsm-core/VENDOR.md.
crsm-core = { path = "crates/crsm-core" }

# Remote terminal (WebSocket server for iPhone access)
axum = { version = "0.8", features = ["ws"] }
qrcode = { version = "0.14", default-features = false }
rust-embed = "8"
uuid = { version = "1", features = ["v4"] }
rand = "0.8.5"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux-specific dependencies (GTK + WebKitGTK for browser pane)
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.54", features = [] }

# macOS-specific dependencies (WKWebView via wry)
[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.54", features = [] }
# AppKit / WebKit bindings. All of these are already in the tree through tao
# and wry; naming them here only adds the few classes the app calls directly.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSObject", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration"] }

# Windows-specific dependencies (WebView2 via wry)
[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "0.54", features = [] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Match WebView2's existing ABI without changing the app's windows 0.58 API.
windows-webview2 = { package = "windows", version = "0.61", default-features = false }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty-0.8.1" }
