<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">mycmux-lite workflow</title>
  <desc id="desc">Five-step workflow: create workspace, launch agent, split panes, drag tabs, zoom and adjust appearance.</desc>
  <rect width="1200" height="460" rx="28" fill="#0b1020"/>
  <text x="64" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">How work moves in mycmux-lite</text>
  <text x="64" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#94a3b8">A trimmed workspace for terminal-first team use: launch, split, drag, zoom, and resume.</text>

  <g font-family="Inter, Segoe UI, sans-serif">
    <g transform="translate(64 150)">
      <rect width="178" height="190" rx="18" fill="#111827" stroke="#334155"/>
      <circle cx="36" cy="38" r="17" fill="#2563eb"/>
      <text x="36" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#eff6ff">1</text>
      <text x="24" y="82" font-size="17" font-weight="800" fill="#f8fafc">Workspace</text>
      <text x="24" y="112" font-size="13" fill="#cbd5e1">Create a focused</text>
      <text x="24" y="134" font-size="13" fill="#cbd5e1">work area for one</text>
      <text x="24" y="156" font-size="13" fill="#cbd5e1">task or project.</text>
    </g>

    <path d="M262 244 H322" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M314 236 L326 244 L314 252" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(342 150)">
      <rect width="178" height="190" rx="18" fill="#111827" stroke="#334155"/>
      <circle cx="36" cy="38" r="17" fill="#0f766e"/>
      <text x="36" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#ecfeff">2</text>
      <text x="24" y="82" font-size="17" font-weight="800" fill="#f8fafc">Launch</text>
      <text x="24" y="112" font-size="13" fill="#cbd5e1">Start Claude Code,</text>
      <text x="24" y="134" font-size="13" fill="#cbd5e1">Codex, resume, or</text>
      <text x="24" y="156" font-size="13" fill="#cbd5e1">a custom command.</text>
    </g>

    <path d="M540 244 H600" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M592 236 L604 244 L592 252" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(620 150)">
      <rect width="178" height="190" rx="18" fill="#111827" stroke="#334155"/>
      <circle cx="36" cy="38" r="17" fill="#7c3aed"/>
      <text x="36" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#f5f3ff">3</text>
      <text x="24" y="82" font-size="17" font-weight="800" fill="#f8fafc">Split panes</text>
      <rect x="24" y="108" width="55" height="36" rx="6" fill="#1e293b"/>
      <rect x="86" y="108" width="55" height="36" rx="6" fill="#1e293b"/>
      <rect x="24" y="152" width="117" height="18" rx="6" fill="#334155"/>
    </g>

    <path d="M818 244 H878" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M870 236 L882 244 L870 252" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(898 150)">
      <rect width="178" height="190" rx="18" fill="#111827" stroke="#334155"/>
      <circle cx="36" cy="38" r="17" fill="#f59e0b"/>
      <text x="36" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#fffbeb">4</text>
      <text x="24" y="82" font-size="17" font-weight="800" fill="#f8fafc">Drag tabs</text>
      <rect x="24" y="108" width="118" height="30" rx="8" fill="#1d4ed8"/>
      <text x="83" y="128" text-anchor="middle" font-size="12" fill="#eff6ff">Codex tab</text>
      <path d="M84 150 C84 170 112 170 112 190" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="440" y="370" width="320" height="44" rx="14" fill="#172554" stroke="#2563eb"/>
  <text x="600" y="398" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#dbeafe">Then zoom the active pane or tune fonts, colors, and backgrounds.</text>
</svg>
