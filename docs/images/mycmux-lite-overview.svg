<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">mycmux-lite application overview</title>
  <desc id="desc">A stylized preview of mycmux-lite with workspace sidebar, terminal panes, launch menu, and appearance settings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1d2e"/>
      <stop offset="0.52" stop-color="#08111f"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#070b13" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="980" cy="118" r="190" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="230" cy="610" r="220" fill="#22c55e" opacity="0.07"/>

  <rect x="56" y="52" width="1088" height="616" rx="18" fill="#06080f" opacity="0.88" filter="url(#softShadow)"/>
  <rect x="56" y="52" width="1088" height="38" rx="18" fill="#111827"/>
  <circle cx="82" cy="71" r="6" fill="#ef4444"/>
  <circle cx="102" cy="71" r="6" fill="#f59e0b"/>
  <circle cx="122" cy="71" r="6" fill="#22c55e"/>
  <text x="600" y="76" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#dbeafe">mycmux-lite</text>

  <rect x="56" y="90" width="202" height="578" fill="#0d1220"/>
  <text x="82" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">WORKSPACES</text>
  <rect x="76" y="148" width="158" height="32" rx="8" fill="#1d4ed8" opacity="0.9"/>
  <text x="92" y="169" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#eff6ff">Team review</text>
  <rect x="76" y="190" width="158" height="32" rx="8" fill="#111827"/>
  <text x="92" y="211" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Build check</text>
  <rect x="76" y="232" width="158" height="32" rx="8" fill="#111827"/>
  <text x="92" y="253" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Docs</text>
  <rect x="76" y="582" width="158" height="36" rx="9" fill="#0f766e" opacity="0.82"/>
  <text x="155" y="605" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ecfeff">New workspace</text>

  <rect x="278" y="110" width="828" height="538" rx="12" fill="#030712" opacity="0.48"/>
  <rect x="296" y="128" width="792" height="248" rx="12" fill="url(#terminal)" stroke="#334155"/>
  <rect x="296" y="128" width="792" height="32" rx="12" fill="#111827"/>
  <rect x="314" y="138" width="86" height="14" rx="6" fill="#1d4ed8"/>
  <text x="418" y="150" font-family="Cascadia Mono, monospace" font-size="12" fill="#93c5fd">Codex</text>
  <text x="320" y="194" font-family="Cascadia Mono, monospace" font-size="14" fill="#e5e7eb">$ codex --no-alt-screen</text>
  <text x="320" y="224" font-family="Cascadia Mono, monospace" font-size="14" fill="#a7f3d0">reading workspace state...</text>
  <text x="320" y="254" font-family="Cascadia Mono, monospace" font-size="14" fill="#fde68a">| task | owner | state |</text>
  <text x="320" y="284" font-family="Cascadia Mono, monospace" font-size="14" fill="#fde68a">| ui   | codex | pass  |</text>
  <rect x="812" y="196" width="226" height="126" rx="14" fill="#0f172a" stroke="#475569"/>
  <text x="925" y="224" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Launch menu</text>
  <text x="842" y="254" font-family="Cascadia Mono, monospace" font-size="12" fill="#cbd5e1">1 Claude Code</text>
  <text x="842" y="278" font-family="Cascadia Mono, monospace" font-size="12" fill="#cbd5e1">4 Codex</text>
  <text x="842" y="302" font-family="Cascadia Mono, monospace" font-size="12" fill="#cbd5e1">9 Custom...</text>

  <rect x="296" y="394" width="378" height="236" rx="12" fill="url(#terminal)" stroke="#334155"/>
  <rect x="296" y="394" width="378" height="32" rx="12" fill="#111827"/>
  <text x="318" y="415" font-family="Cascadia Mono, monospace" font-size="12" fill="#93c5fd">Claude Code</text>
  <text x="320" y="460" font-family="Cascadia Mono, monospace" font-size="13" fill="#e5e7eb">Plan</text>
  <text x="320" y="488" font-family="Cascadia Mono, monospace" font-size="13" fill="#cbd5e1">1. inspect</text>
  <text x="320" y="516" font-family="Cascadia Mono, monospace" font-size="13" fill="#cbd5e1">2. edit</text>
  <text x="320" y="544" font-family="Cascadia Mono, monospace" font-size="13" fill="#cbd5e1">3. verify</text>

  <rect x="692" y="394" width="396" height="236" rx="12" fill="url(#terminal)" stroke="#334155"/>
  <rect x="692" y="394" width="396" height="32" rx="12" fill="#111827"/>
  <text x="714" y="415" font-family="Cascadia Mono, monospace" font-size="12" fill="#93c5fd">Shell</text>
  <text x="716" y="460" font-family="Cascadia Mono, monospace" font-size="13" fill="#e5e7eb">npm run build</text>
  <text x="716" y="488" font-family="Cascadia Mono, monospace" font-size="13" fill="#86efac">✓ tsc</text>
  <text x="716" y="516" font-family="Cascadia Mono, monospace" font-size="13" fill="#86efac">✓ vite</text>
  <text x="716" y="544" font-family="Cascadia Mono, monospace" font-size="13" fill="#86efac">✓ tauri</text>

  <rect x="820" y="124" width="210" height="48" rx="13" fill="#172554" stroke="#2563eb"/>
  <text x="925" y="154" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#dbeafe">no file sidebar, no Buddy</text>
</svg>
