name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.19.2-lite.1)"
        required: true
        type: string
      runner:
        description: "Runner label to use for manual releases"
        required: false
        default: "windows-latest"
        type: choice
        options:
          - "windows-latest"
          - "self-hosted"

permissions:
  contents: write

jobs:
  test:
    # Manual dispatch can route the whole pipeline to the self-hosted runner
    # (e.g. when GitHub-hosted minutes are exhausted); tag pushes stay hosted.
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test (release)
        working-directory: src-tauri
        run: cargo test --release

      # Self-hosted runner uses the machine's Python (setup-python needs
      # admin registry access there); hosted runners install 3.10 as before.
      - uses: actions/setup-python@v5
        if: ${{ (github.event.inputs.runner || 'windows-latest') == 'windows-latest' }}
        with:
          python-version: "3.10"

      - name: Install Python test dependencies
        if: ${{ (github.event.inputs.runner || 'windows-latest') == 'windows-latest' }}
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Pytest
        run: python -m pytest tests/ -q

  build-lite:
    needs: test
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Persist MSVC env (PATH/INCLUDE/LIB/...) into $env:GITHUB_ENV so that
      # cargo/link.exe is reachable from every subsequent step (tauri-action
      # spawns its own shell, so env from `ilammy/msvc-dev-cmd@v1` alone is
      # not always inherited reliably).
      - name: Persist MSVC env to GITHUB_ENV
        shell: powershell
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = $null
          if (Test-Path $vswhere) {
            $vsInstall = & $vswhere -latest -property installationPath
          }
          if (-not $vsInstall) {
            $candidates = @(
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools",
              "C:\Program Files\Microsoft Visual Studio\2022\BuildTools",
              "C:\Program Files\Microsoft Visual Studio\2022\Community",
              "C:\Program Files\Microsoft Visual Studio\2022\Professional",
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path (Join-Path $candidate "VC\Auxiliary\Build\vcvarsall.bat")) {
                $vsInstall = $candidate
                break
              }
            }
          }
          if (-not $vsInstall) { throw "Visual Studio install not found via vswhere or known BuildTools paths" }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }
          # vcvarsall.bat shells out to vswhere.exe; on self-hosted runners the
          # VS Installer dir is not on PATH, so add it (mirrors build-lite.ps1).
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH;C:\Program Files (x86)\Microsoft Visual Studio\Installer"
          $output = cmd /c "`"$vcvars`" x64 && set" 2>$null
          foreach ($line in $output) {
            if ($line -match "^([^=]+)=(.*)$") {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          Write-Host "Persisted MSVC env from $vsInstall"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify mycmux-team release authentication
        shell: powershell
        env:
          TARGET_TOKEN: ${{ secrets.MYCMUX_TEAM_RELEASE_TOKEN }}
          SELECTED_RUNNER: ${{ github.event.inputs.runner || 'windows-latest' }}
        run: |
          if ($env:TARGET_TOKEN) {
            $env:GH_TOKEN = $env:TARGET_TOKEN
          } elseif ($env:SELECTED_RUNNER -eq "self-hosted") {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
            gh auth status --hostname github.com
          } else {
            throw "MYCMUX_TEAM_RELEASE_TOKEN is required on GitHub-hosted runners to publish miyafcos/mycmux-team. Dispatch this workflow with runner=self-hosted to use ambient gh authentication."
          }
          gh repo view miyafcos/mycmux-team --json nameWithOwner --jq .nameWithOwner

      - name: Enable updater artifacts
        shell: powershell
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Path $configPath -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -MemberType NoteProperty -Name createUpdaterArtifacts -Value $true -Force
          $json = $config | ConvertTo-Json -Depth 100
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $configPath), $json, $utf8NoBom)

      - name: Build & sign (mycmux-lite)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_KEY_LITE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_LITE_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "mycmux-lite ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            mycmux-lite team build (${{ github.event.inputs.tag || github.ref_name }}).

            See `CHANGELOG.md` for details.

            **Auto-update**: existing installations will detect this release via the in-app updater (設定 → アプリ情報 → 更新を確認).
          releaseDraft: false
          prerelease: false

      - name: Publish lite release to mycmux-team
        shell: powershell
        env:
          TARGET_TOKEN: ${{ secrets.MYCMUX_TEAM_RELEASE_TOKEN }}
          SELECTED_RUNNER: ${{ github.event.inputs.runner || 'windows-latest' }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:TARGET_TOKEN) {
            $env:GH_TOKEN = $env:TARGET_TOKEN
          } elseif ($env:SELECTED_RUNNER -eq "self-hosted") {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
            gh auth status --hostname github.com
          } else {
            throw "MYCMUX_TEAM_RELEASE_TOKEN is required on GitHub-hosted runners."
          }

          $tag = $env:RELEASE_TAG
          $expectedVersion = $tag -replace '^v', ''
          $targetRepo = "miyafcos/mycmux-team"
          $bundleRoot = Resolve-Path "src-tauri/target/release/bundle"
          # tauri-action uploads latest.json to the SOURCE repo release, not the local
          # bundle dir (verified 2026-07-16: run 29496169718 found 0 local copies).
          $latestDir = Join-Path $env:RUNNER_TEMP "mycmux-lite-latest"
          New-Item -ItemType Directory -Path $latestDir -Force | Out-Null
          gh release download $tag --repo $env:SOURCE_REPO --pattern "latest.json" --dir $latestDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download latest.json from source release $($env:SOURCE_REPO) $tag." }
          $latestPath = Join-Path $latestDir "latest.json"
          $latestText = Get-Content -LiteralPath $latestPath -Raw -Encoding UTF8
          $sourcePrefix = "https://github.com/$($env:SOURCE_REPO)/releases/download/$tag/"
          $targetPrefix = "https://github.com/$targetRepo/releases/download/$tag/"
          $latestText = $latestText.Replace($sourcePrefix, $targetPrefix)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($latestPath, $latestText, $utf8NoBom)
          .\scripts\normalize-updater-feed.ps1 -InputPath $latestPath

          $latest = Get-Content -LiteralPath $latestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($latest.version -ne $expectedVersion) {
            throw "latest.json version '$($latest.version)' does not match tag version '$expectedVersion'."
          }
          $platformJson = $latest.platforms | ConvertTo-Json -Depth 20 -Compress
          if ($env:SOURCE_REPO -ne $targetRepo -and $platformJson.Contains($sourcePrefix)) {
            throw "latest.json still references source release URLs: $sourcePrefix"
          }
          if (-not $platformJson.Contains($targetPrefix)) {
            throw "latest.json does not reference target release URLs: $targetPrefix"
          }
          $plain = $latest.platforms.'windows-x86_64'
          $nsis = $latest.platforms.'windows-x86_64-nsis'
          if ($null -eq $plain -or $null -eq $nsis -or $plain.signature -ne $nsis.signature -or $plain.url -ne $nsis.url) {
            throw "windows-x86_64 fallback does not match windows-x86_64-nsis after normalization."
          }

          $bundleFiles = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File | Where-Object {
            $_.Extension -in @(".exe", ".msi", ".sig")
          })
          $nsisInstallers = @($bundleFiles | Where-Object { $_.Extension -eq ".exe" })
          $msiInstallers = @($bundleFiles | Where-Object { $_.Extension -eq ".msi" })
          $signatures = @($bundleFiles | Where-Object { $_.Extension -eq ".sig" })
          if ($nsisInstallers.Count -ne 1 -or $msiInstallers.Count -ne 1 -or $signatures.Count -lt 2) {
            throw "Unexpected Windows artifact set: NSIS=$($nsisInstallers.Count), MSI=$($msiInstallers.Count), signatures=$($signatures.Count)."
          }

          # PS 5.1 + ErrorActionPreference=Stop turns native stderr ("release not
          # found") into a terminating NativeCommandError, so probe existence via
          # cmd where stderr never becomes an error record (run 29498599872).
          $ErrorActionPreference = "Continue"
          cmd /c "gh release view $tag --repo $targetRepo >NUL 2>&1"
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            gh release edit $tag --repo $targetRepo --draft=false --prerelease=false --latest
          } else {
            gh release create $tag --repo $targetRepo --verify-tag --title "mycmux-lite $tag" --notes "mycmux-lite team build ($tag). See CHANGELOG.md for details." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to create or update target release $targetRepo $tag." }
          # Stay on Continue: every remaining gh call is guarded by an explicit
          # $LASTEXITCODE throw, and gh may write benign progress to stderr.

          $uploadPaths = @($bundleFiles | ForEach-Object { $_.FullName }) + @($latestPath)
          $uploadArgs = @("release", "upload", $tag) + $uploadPaths + @("--clobber", "--repo", $targetRepo)
          gh @uploadArgs
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload lite release assets to $targetRepo $tag." }

          $verifyDir = Join-Path $env:RUNNER_TEMP "mycmux-lite-release-verify"
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download $tag --repo $targetRepo --pattern "latest.json" --dir $verifyDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download published latest.json for verification." }
          $published = Get-Content -LiteralPath (Join-Path $verifyDir "latest.json") -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($published.version -ne $expectedVersion) {
            throw "Published latest.json version '$($published.version)' does not match '$expectedVersion'."
          }
          Write-Host "Published mycmux-lite $tag to $targetRepo and verified latest.json."
