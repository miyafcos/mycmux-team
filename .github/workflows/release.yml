name: Release

# Tag pushes are disabled because GitHub-hosted Actions billing is suspended.
# Keep manual dispatch available for an intentionally selected runner.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.4.4)"
        required: true
        type: string
      runner:
        description: "Runner label to use for manual releases"
        required: false
        default: "windows-latest"
        type: choice
        options:
          - "windows-latest"
          - "self-hosted"

permissions:
  contents: write

jobs:
  test:
    # Manual dispatch can route the whole pipeline to the selected runner.
    # Tag pushes do not start this workflow while hosted Actions are unpaid.
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test (release)
        working-directory: src-tauri
        run: cargo test --release

      # Self-hosted runner uses the machine's Python (setup-python needs
      # admin registry access there); hosted runners install 3.10 as before.
      - uses: actions/setup-python@v5
        if: ${{ (github.event.inputs.runner || 'windows-latest') == 'windows-latest' }}
        with:
          python-version: "3.10"

      - name: Install Python test dependencies
        if: ${{ (github.event.inputs.runner || 'windows-latest') == 'windows-latest' }}
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Pytest
        run: python -m pytest tests/ -q

  build-personal:
    needs: test
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Persist MSVC env (PATH/INCLUDE/LIB/...) into $env:GITHUB_ENV so that
      # cargo/link.exe is reachable from every subsequent step (tauri-action
      # spawns its own shell, so env from `ilammy/msvc-dev-cmd@v1` alone is
      # not always inherited reliably).
      - name: Persist MSVC env to GITHUB_ENV
        shell: powershell
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = $null
          if (Test-Path $vswhere) {
            $vsInstall = & $vswhere -latest -property installationPath
          }
          if (-not $vsInstall) {
            $candidates = @(
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools",
              "C:\Program Files\Microsoft Visual Studio\2022\BuildTools",
              "C:\Program Files\Microsoft Visual Studio\2022\Community",
              "C:\Program Files\Microsoft Visual Studio\2022\Professional",
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path (Join-Path $candidate "VC\Auxiliary\Build\vcvarsall.bat")) {
                $vsInstall = $candidate
                break
              }
            }
          }
          if (-not $vsInstall) { throw "Visual Studio install not found via vswhere or known BuildTools paths" }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }
          # vcvarsall.bat shells out to vswhere.exe; on self-hosted runners the
          # VS Installer dir is not on PATH, so add it (mirrors build-personal.ps1).
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH;C:\Program Files (x86)\Microsoft Visual Studio\Installer"
          $output = cmd /c "`"$vcvars`" x64 && set" 2>$null
          foreach ($line in $output) {
            if ($line -match "^([^=]+)=(.*)$") {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          Write-Host "Persisted MSVC env from $vsInstall"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Enable updater artifacts
        shell: powershell
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Path $configPath -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -MemberType NoteProperty -Name createUpdaterArtifacts -Value $true -Force
          $json = $config | ConvertTo-Json -Depth 100
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $configPath), $json, $utf8NoBom)

      - name: Build & sign (mycmux personal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_KEY_PERSONAL }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PERSONAL_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "mycmux ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            mycmux personal build (${{ github.event.inputs.tag || github.ref_name }}).

            See `CHANGELOG.md` for details.

            **Auto-update**: existing installations will detect this release via the in-app updater (設定 → アプリ情報 → 更新を確認).
          releaseDraft: false
          prerelease: false

      - name: Mirror personal updater feed
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MYCMUX_TEAM_RELEASE_TOKEN }}
          SOURCE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if (-not $env:GH_TOKEN) {
            $message = "MYCMUX_TEAM_RELEASE_TOKEN is not configured; skipping the public personal updater feed mirror. Existing installations will NOT see this release via the in-app updater until this is fixed."
            Write-Host "::error::$message"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## :x: Updater feed mirror skipped`n`n$message"
            }
            exit 1
          }
          .\scripts\mirror-personal-updater-feed.ps1 -SourceTag $env:SOURCE_TAG
