name: Public Windows runtime error probe
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Frozen public source
        required: true
        type: string
      source_tree:
        description: Frozen public tree
        required: true
        type: string
      version:
        description: Candidate version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-runtime-probe
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_VERSION: ${{ inputs.version }}
      CARGO_BUILD_JOBS: "2"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate frozen inputs and resource gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -ne 'ef72c0672d5a3a78685e7eab9511f07ddcca8892') { throw 'Unexpected source' }
          if ($env:SOURCE_TREE -ne 'e3ecd9d24c153471345dcdeef60d1945171510fc') { throw 'Unexpected tree' }
          if ($env:RELEASE_VERSION -ne '0.88.6') { throw 'Unexpected version' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Cannot set LF checkout' }
          $free = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          if ($free -lt 5.2) { throw 'Start memory gate' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: product-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Apply diagnostic-only logger
        shell: pwsh
        run: |
          & python -I -X utf8 ci-control/.github/ci/prepare_runtime_probe.py --source product-source --receipt probe-evidence/patch-receipt.json
          if ($LASTEXITCODE) { throw 'Diagnostic patch failed' }
      - name: Restore unchanged locked Node dependencies
        working-directory: product-source
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { throw 'Locked dependency restoration failed' }
      - name: Build non-distribution diagnostic executable
        working-directory: product-source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & npm run tauri -- build --no-bundle -- --locked 2>&1 | Tee-Object -FilePath ../probe-evidence/diagnostic-build.log
          if ($LASTEXITCODE) { throw 'Diagnostic build failed' }
      - name: Verify diagnostic binary and exact patch
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path('product-source')
          out=Path('probe-evidence')
          receipt=json.loads((out/'patch-receipt.json').read_text(encoding='utf-8'))
          assert receipt['diagnostic_only'] and not receipt['production_update'] and receipt['new_packages']==[]
          changes=subprocess.check_output(['git','diff','HEAD','--name-only'],cwd=root).decode().splitlines()
          assert set(changes)=={row['path'] for row in receipt['files']}
          for row in receipt['files']:
              assert hashlib.sha256((root/row['path']).read_bytes()).hexdigest()==row['diagnostic_sha256']
          binary=root/'src-tauri/target/release/mycmux.exe'
          actual=subprocess.check_output(['powershell.exe','-NoProfile','-Command',"(Get-Item -LiteralPath '"+str(binary.resolve())+"').VersionInfo.ProductVersion"],text=True).strip()
          assert actual=='0.88.6'
          receipt.update(exe_sha256=hashlib.sha256(binary.read_bytes()).hexdigest(),exe_size=binary.stat().st_size,version=actual,ci_control=os.environ['GITHUB_SHA'])
          (out/'diagnostic-build-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print('DIAGNOSTIC_ONLY_BINARY_VERIFIED',receipt['exe_sha256'])
      - name: Run diagnostic on isolated desktop
        shell: pwsh
        run: |
          & python -I -X utf8 ci-control/.github/ci/hidden_runtime_probe.py --exe product-source/src-tauri/target/release/mycmux.exe --build-receipt probe-evidence/diagnostic-build-receipt.json --out smoke-output --probe ci-control/.github/ci/webview_probe_0886.mjs --version 0.88.6 2>&1 | Tee-Object -FilePath probe-evidence/hidden-smoke.log
          if ($LASTEXITCODE) { throw 'Diagnostic startup did not pass; inspect runtime error evidence' }
      - name: Retain filtered diagnostic evidence only
        if: ${{ always() }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          out=Path('probe-evidence')
          out.mkdir(exist_ok=True)
          paths=[out/name for name in ['patch-receipt.json','diagnostic-build.log','diagnostic-build-receipt.json','hidden-smoke.log']]
          paths += [Path('smoke-output')/name for name in ['smoke-receipt.json','safe-diagnostic.json']]
          files=[path for path in paths if path.is_file()]
          assert files
          for path in files:
              if path.stat().st_size==0: path.write_text('[no output]\n',encoding='utf-8')
          manifest=out/'runtime-probe-manifest.json'
          manifest.write_text(json.dumps({'public_source':os.environ['SOURCE_COMMIT'],'diagnostic_only':True,'production_update':False,'binary_uploaded':False,'raw_profile_uploaded':False,'files':[{'name':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'size':path.stat().st_size} for path in files]},indent=2)+'\n',encoding='utf-8')
          subprocess.run(['gh','release','create','windows-runtime-probe-'+os.environ['GITHUB_RUN_ID'],*map(str,files),str(manifest),'--repo','miyafcos/mycmux-team','--draft','--target',os.environ['SOURCE_COMMIT'],'--title','Window runtime diagnostic','--notes','Diagnostic-only build evidence. No distribution binaries, profile contents or updater changes.'],check=True)
