name: Public Windows build
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Fixed public source commit"
        required: true
        type: string
      source_tree:
        description: "Expected public source tree"
        required: true
        type: string
      version:
        description: "Expected application version"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-build
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_VERSION: ${{ inputs.version }}
      CARGO_BUILD_JOBS: "2"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate fixed inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source commit' }
          if ($env:SOURCE_TREE -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source tree' }
          if ($env:RELEASE_VERSION -ne '0.89.1') { throw 'Unexpected version' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Cannot configure checkout line endings' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify source and RAM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_COMMIT) { throw 'Source commit mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:SOURCE_TREE) { throw 'Source tree mismatch' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $env:RELEASE_VERSION) { throw 'Package version mismatch' }
          if ((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version -ne $env:RELEASE_VERSION) { throw 'Tauri version mismatch' }
          $freeRam = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Output ("Free RAM: {0:N2} GiB" -f $freeRam)
          if ($freeRam -lt 5.2) { throw 'Windows build RAM gate failed' }
          New-Item -ItemType Directory -Path cloud-output | Out-Null
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Restore locked Node dependencies
        run: npm ci
      - name: Native Windows Rust verification
        id: rust
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -X utf8 scripts/run_windows_tests.py 2>&1 | Tee-Object -FilePath cloud-output/rust-final.log
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows Rust verification failed' }
      - name: Check e2e tests and examples
        id: e2e
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo check --manifest-path src-tauri/Cargo.toml --features e2e --tests --examples --locked 2>&1 | Tee-Object -FilePath cloud-output/rust-e2e-check.log
          if ($LASTEXITCODE -ne 0) { throw 'E2e compile check failed' }
      - name: Build Windows bundles without updater private keys
        id: bundle
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $pwd 'cloud-updater-config.json'
          [System.IO.File]::WriteAllText($config, '{"bundle":{"createUpdaterArtifacts":false}}', [System.Text.UTF8Encoding]::new($false))
          & npm run tauri -- build --bundles nsis,msi --config $config 2>&1 | Tee-Object -FilePath cloud-output/windows-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows bundle build failed' }
          if ((Get-Item src-tauri/target/release/mycmux.exe).VersionInfo.ProductVersion -ne $env:RELEASE_VERSION) { throw 'Executable version mismatch' }
      - name: Retain diagnostics and source receipt
        if: ${{ always() && steps.rust.outcome != 'skipped' }}
        shell: python
        env:
          RUST_OUTCOME: ${{ steps.rust.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
        run: |
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess
          out = Path('cloud-output')
          out.mkdir(exist_ok=True)
          version = os.environ['RELEASE_VERSION']
          changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode('utf-8').split('\0')
          unexpected = [path for path in untracked if path and not path.startswith('cloud-output/') and path != 'cloud-updater-config.json']
          patch = subprocess.check_output(['git', 'diff', '--binary', 'HEAD', '--', 'src-tauri/permissions', 'src-tauri/gen/schemas', 'src-tauri/Cargo.lock'])
          if patch:
              (out/'generated-source.patch').write_bytes(patch)
          (out/'changed-paths.json').write_text(json.dumps(changed, indent=2)+'\n', encoding='utf-8')
          allowed = [path for path in sorted(set(changed + unexpected)) if path.startswith(('src-tauri/permissions/', 'src-tauri/gen/schemas/')) or path == 'src-tauri/Cargo.lock']
          if allowed:
              (out/'generated').mkdir(parents=True, exist_ok=True)
          for relative in allowed:
              source = Path(relative)
              if source.is_file():
                  target = out/'generated'/relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          if allowed:
              shutil.make_archive(str(out/'generated-source'), 'zip', out/'generated')
          root = Path('src-tauri/target/release')
          for source in [root/'mycmux.exe', root/'bundle/nsis'/f'mycmux_{version}_x64-setup.exe', root/'bundle/msi'/f'mycmux_{version}_x64_en-US.msi']:
              if source.is_file():
                  shutil.copy2(source, out/source.name)
          records = []
          for path in sorted(out.iterdir()):
              if path.is_file():
                  state = hashlib.sha256()
                  with path.open('rb') as stream:
                      for block in iter(lambda: stream.read(1024*1024), b''):
                          state.update(block)
                  records.append({'name':path.name, 'size':path.stat().st_size, 'sha256':state.hexdigest()})
          outcomes = {name:os.environ[name.upper()+'_OUTCOME'] for name in ['rust','e2e','bundle']}
          receipt = {'version':version, 'public_source_commit':os.environ['SOURCE_COMMIT'], 'public_source_tree':os.environ['SOURCE_TREE'], 'outcomes':outcomes, 'changed_paths':changed, 'unexpected_untracked':unexpected, 'assets':records, 'ready':not changed and not unexpected and all(value=='success' for value in outcomes.values()), 'updater_signing':'not performed'}
          (out/'cloud-build-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
      - name: Save build output as a draft release
        if: ${{ always() && steps.rust.outcome != 'skipped' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path cloud-output/cloud-build-receipt.json)) { throw 'Missing receipt' }
          $files = @(Get-ChildItem -LiteralPath cloud-output -File | ForEach-Object { $_.FullName })
          & gh release create ('windows-build-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT) @files --repo $env:GITHUB_REPOSITORY --draft --target $env:SOURCE_COMMIT --title ('Windows build ' + $env:RELEASE_VERSION) --notes 'Unsigned build and diagnostics. Not accepted for release until every check and source-invariance gate passes.'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retain build results' }
      - name: Enforce acceptance
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path cloud-output/cloud-build-receipt.json)) { throw 'No complete build receipt' }
          $receipt = Get-Content cloud-output/cloud-build-receipt.json -Raw | ConvertFrom-Json
          if (-not $receipt.ready) { throw 'Build or source-invariance acceptance failed; retained draft is diagnostic only' }
