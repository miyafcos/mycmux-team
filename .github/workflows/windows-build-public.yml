name: Public Windows Python contracts
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Public export commit to verify"
        required: true
        type: string
      source_tree:
        description: "Expected public export tree"
        required: true
        type: string
      version:
        description: "Expected application version"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-python-contracts
  cancel-in-progress: false
jobs:
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [codex, grokbot, handoff-0, handoff-1, handoff-2, handoff-3, restore, terminal]
        locale: [default, C]
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_VERSION: ${{ inputs.version }}
      TEST_GROUP: ${{ matrix.group }}
      TEST_LOCALE: ${{ matrix.locale }}
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -ne '009d1c28f9e9d6be65a2bab55283cb87ad9b76b9') { throw 'Invalid source commit' }
          if ($env:SOURCE_TREE -ne '3009534310c2b6f0e0abff9c9b55120b471b3f8b') { throw 'Invalid source tree' }
          if ($env:RELEASE_VERSION -ne '0.89.0') { throw 'Unexpected version' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Cannot configure checkout line endings' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify fixed source and RAM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_COMMIT) { throw 'Source mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:SOURCE_TREE) { throw 'Tree mismatch' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $env:RELEASE_VERSION) { throw 'Version mismatch' }
          $freeRam = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Output ("Free RAM: {0:N2} GiB" -f $freeRam)
          if ($freeRam -lt 5.2) { throw 'Runner RAM gate failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Restore locked Node dependencies
        shell: pwsh
        run: npm ci
      - name: Install approved pinned test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Approved test dependencies unavailable' }
      - name: Verify frontend and available Python contracts
        shell: python
        run: |
          from __future__ import annotations

          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time

          FILES = {
              'codex': 'test_codex_restore_runtime.py',
              'grokbot': 'test_launcher_grokbot_app.py',
              'handoff-0': 'test_launcher_handoff_env.py',
              'handoff-1': 'test_launcher_handoff_env.py',
              'handoff-2': 'test_launcher_handoff_env.py',
              'handoff-3': 'test_launcher_handoff_env.py',
              'restore': 'test_launcher_restore_auto_contract.py',
              'terminal': 'test_terminal_interactive_boot.py',
          }


          def main() -> int:
              root = Path.cwd()
              out = root / 'cloud-output'
              out.mkdir(exist_ok=False)
              group, locale = os.environ['TEST_GROUP'], os.environ['TEST_LOCALE']
              test_file = FILES[group]
              child = dict(os.environ, PYTHONDONTWRITEBYTECODE='1', PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', PYTHONUTF8='1', SHELL='/usr/bin/bash')
              child['PATH'] = 'C:/Program Files/Git/usr/bin' + os.pathsep + child['PATH']
              if locale == 'C':
                  child['LC_ALL'] = 'C'
              else:
                  child.pop('LC_ALL', None)
              record = {'group': group, 'locale': locale, 'file': test_file, 'source_commit': os.environ['SOURCE_COMMIT'], 'source_tree': os.environ['SOURCE_TREE'], 'records': [], 'errors': [], 'config_override': None}
              cwd = root
              started = time.monotonic()
              try:
                  if group == 'terminal':
                      cwd = out / 'testtree'
                      subprocess.run(['git', 'worktree', 'add', '--detach', str(cwd), os.environ['SOURCE_COMMIT']], check=True, timeout=90)
                      subprocess.run(['cmd', '/d', '/c', 'mklink', '/J', str(cwd / 'node_modules'), str(root / 'node_modules')], check=True, capture_output=True, timeout=30)
                      config = cwd / 'vitest.config.ts'
                      before = config.read_bytes()
                      (out / 'vitest-original.txt').write_bytes(before)
                      content = 'import { defineConfig } from "vitest/config";\nexport default defineConfig({test:{environment:"node",include:["tests/unit/terminalShellRestore.test.ts"],maxWorkers:1,fileParallelism:false}});\n'
                      config.write_text(content, encoding='utf-8')
                      record['config_override'] = {'before_sha256': hashlib.sha256(before).hexdigest(), 'after_sha256': hashlib.sha256(content.encode()).hexdigest(), 'reason': 'target test does not import private baseline aliases; no test or product changes', 'path': str(config)}
                  collected = subprocess.run([sys.executable, '-B', '-X', 'utf8', '-m', 'pytest', 'tests/' + test_file, '--collect-only', '-q', '-p', 'no:cacheprovider'], cwd=cwd, env=child, capture_output=True, text=True, encoding='utf-8', timeout=90)
                  (out / 'collection.log').write_text(collected.stdout + collected.stderr, encoding='utf-8')
                  if collected.returncode:
                      raise RuntimeError('Collection failed')
                  all_nodes = [line.strip() for line in collected.stdout.splitlines() if line.startswith('tests/') and '::' in line]
                  if not all_nodes:
                      raise RuntimeError('No collected test nodes')
                  nodes = [node for index, node in enumerate(all_nodes) if index % 4 == int(group[-1])] if group.startswith('handoff-') else all_nodes
                  record['collected_nodes'] = all_nodes
                  record['selected_nodes'] = nodes
                  for index, node in enumerate(nodes):
                      label = 'case-' + str(index).zfill(3)
                      command = [sys.executable, '-B', '-X', 'utf8', '-m', 'pytest', node, '-vv', '-p', 'no:cacheprovider', '--junitxml=' + str(out / (label + '.xml'))]
                      clock = time.monotonic()
                      with (out / (label + '.log')).open('xb') as log:
                          process = subprocess.Popen(command, cwd=cwd, env=child, stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
                          try:
                              exit_code = process.wait(timeout=600 if group == 'codex' else 90)
                          except subprocess.TimeoutExpired:
                              subprocess.run(['taskkill', '/PID', str(process.pid), '/T', '/F'], capture_output=True, timeout=30)
                              process.wait(timeout=30)
                              exit_code = 124
                      record['records'].append({'node': node, 'exit': exit_code, 'seconds': round(time.monotonic()-clock,3), 'xml': label + '.xml'})
                      print(group + '/' + locale + ' ' + str(index + 1) + '/' + str(len(nodes)) + ' exit=' + str(exit_code), flush=True)
              except Exception as error:
                  record['errors'].append(type(error).__name__ + ': ' + str(error))
              finally:
                  record['changed'] = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], cwd=root, text=True).splitlines()
                  record['testtree_changed'] = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], cwd=cwd, text=True).splitlines() if cwd != root else []
                  untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'], cwd=cwd).decode().split('\0')
                  record['unexpected'] = [name for name in untracked if name and not name.startswith('cloud-output/')]
                  retained = []
                  for name in record['unexpected']:
                      path = cwd / name
                      if path.is_file():
                          target = out / 'retained' / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(path, target)
                          retained.append({'path': name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'size': path.stat().st_size})
                  if retained:
                      shutil.make_archive(str(out / 'retained-generated'), 'zip', out / 'retained')
                  record['retained_generated'] = retained
                  record['seconds'] = round(time.monotonic()-started, 3)
                  record['test_success'] = bool(record.get('selected_nodes')) and len(record['records']) == len(record['selected_nodes']) and all(row['exit'] == 0 for row in record['records']) and not record['errors']
                  record['accepted'] = record['test_success'] and not record['changed'] and not record['unexpected'] and record['testtree_changed'] in ([], ['vitest.config.ts'])
                  for path in out.glob('*.log'):
                      if path.stat().st_size == 0:
                          path.write_text('[no output]\n', encoding='utf-8')
                  record['assets'] = [{'name': path.name, 'size': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in out.iterdir() if path.is_file()]
                  (out / 'receipt.json').write_text(json.dumps(record, indent=2), encoding='utf-8')
              return 0 if record['accepted'] else 1


          if __name__ == '__main__':
              raise SystemExit(main())
      - name: Retain regression results as draft
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path cloud-output/receipt.json)) { throw 'No completed regression receipt; no results retained' }
          $files = @(Get-ChildItem -LiteralPath cloud-output -File | ForEach-Object { $_.FullName })
          $tag = 'windows-contract-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + $env:TEST_GROUP + '-' + $env:TEST_LOCALE
          & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --draft --target $env:SOURCE_COMMIT --title ('Windows regression ' + $env:RELEASE_VERSION) --notes 'Verification results only. No installable release or updater change.'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retain regression results' }
