name: Public Windows Python contracts
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Public export commit to verify"
        required: true
        type: string
      source_tree:
        description: "Expected public export tree"
        required: true
        type: string
      version:
        description: "Expected application version"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-python-contracts
  cancel-in-progress: false
jobs:
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -ne '009d1c28f9e9d6be65a2bab55283cb87ad9b76b9') { throw 'Invalid source commit' }
          if ($env:SOURCE_TREE -ne '3009534310c2b6f0e0abff9c9b55120b471b3f8b') { throw 'Invalid source tree' }
          if ($env:RELEASE_VERSION -ne '0.89.0') { throw 'Unexpected version' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Cannot configure checkout line endings' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify fixed source and RAM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_COMMIT) { throw 'Source mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:SOURCE_TREE) { throw 'Tree mismatch' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $env:RELEASE_VERSION) { throw 'Version mismatch' }
          $freeRam = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Output ("Free RAM: {0:N2} GiB" -f $freeRam)
          if ($freeRam -lt 5.2) { throw 'Runner RAM gate failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Restore locked Node dependencies
        shell: pwsh
        run: npm ci
      - name: Install approved pinned test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Approved test dependencies unavailable' }
      - name: Verify frontend and available Python contracts
        shell: python
        run: |
          from __future__ import annotations

          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time


          def run_probe(command: list[str], cwd: Path, environment: dict, label: str, output: Path, limit: int) -> dict:
              started = time.monotonic()
              with (output / (label + '.log')).open('xb') as log:
                  process = subprocess.Popen(command, cwd=cwd, env=environment, stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
                  try:
                      code = process.wait(timeout=limit)
                  except subprocess.TimeoutExpired:
                      stopped = subprocess.run(['taskkill', '/PID', str(process.pid), '/T', '/F'], capture_output=True, timeout=30)
                      process.wait(timeout=30)
                      code = 124
                      log.write(b'\nTIMEOUT; OWNED_PROCESS_TREE_STOP_EXIT=' + str(stopped.returncode).encode())
              print(label + ' exit=' + str(code), flush=True)
              return {'label': label, 'exit': code, 'seconds': round(time.monotonic() - started, 3), 'timeout': limit}


          def main() -> int:
              root = Path.cwd()
              output = root / 'cloud-output'
              output.mkdir(exist_ok=False)
              records = []
              errors = []
              environment = dict(os.environ, PYTHONDONTWRITEBYTECODE='1', PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', PYTHONUTF8='1')
              environment['PATH'] = 'C:/Program Files/Git/usr/bin' + os.pathsep + environment['PATH']
              environment['SHELL'] = '/usr/bin/bash'
              powershell = shutil.which('powershell')
              assert powershell
              try:
                  minimal = {key: environment[key] for key in ['PATH', 'SystemRoot', 'WINDIR', 'TEMP', 'TMP', 'PATHEXT'] if key in environment}
                  operating_system = {key: environment[key] for key in ['SystemDrive', 'ProgramData', 'USERPROFILE', 'LOCALAPPDATA', 'APPDATA', 'COMSPEC', 'PSModulePath'] if key in environment}
                  command = [powershell, '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', "$PSVersionTable.PSVersion.ToString(); $null=Get-Command __mycmux_absent_probe__ -ErrorAction SilentlyContinue; [Console]::WriteLine('LOOKUP_DONE'); exit 0"]
                  for label, child in [('minimal', minimal), ('os-paths', {**minimal, **operating_system}), ('normal', environment)]:
                      working = output / label
                      working.mkdir()
                      records.append(run_probe(command, working, child, label, output, 45))
                      records[-1]['environment_keys'] = sorted(child) if label != 'normal' else ['normal runner environment; values not recorded']
                      records[-1]['generated_files'] = [path.relative_to(working).as_posix() for path in working.rglob('*') if path.is_file()]
                  baseline = output / 'baseline'
                  base = '3119b7d0eda87595970b83d3c57c26d2d9530391'
                  subprocess.run(['git', 'fetch', '--no-tags', 'origin', base], check=True, timeout=90)
                  subprocess.run(['git', 'worktree', 'add', '--detach', str(baseline), base], check=True, timeout=90)
                  for label, directory in [('base', baseline), ('candidate', root)]:
                      command = [sys.executable, '-B', '-X', 'utf8', '-m', 'pytest', 'tests/test_public_export.py::test_gate_scans_nul_in_source_and_unicode_escapes', '-vv', '-p', 'no:cacheprovider', '--junitxml=' + str(output / (label + '-nul.xml'))]
                      records.append(run_probe(command, directory, environment, label + '-nul', output, 60))
                  record_paths = ['tests/test_public_export.py', 'scripts/public_scrub_gate.py']
                  correspondence = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() == hashlib.sha256((baseline / name).read_bytes()).hexdigest() for name in record_paths}
                  assert all(correspondence.values())
                  code = "import runpy,shutil; m=runpy.run_path('tests/test_codex_restore_runtime.py'); m['run_powershell']('exact',shutil.which('powershell')); print('EXACT_ORIGINAL_ASSERTIONS_PASS')"
                  records.append(run_probe([sys.executable, '-B', '-X', 'utf8', '-c', code], root, environment, 'original-exact', output, 90))
              except Exception as error:
                  errors.append(type(error).__name__ + ': ' + str(error))
              finally:
                  changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines()
                  untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')
                  unexpected = [name for name in untracked if name and not name.startswith('cloud-output/')]
                  assets = [{'name': path.name, 'size': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in output.iterdir() if path.is_file()]
                  receipt = {'scope': 'diagnostic only; not release acceptance', 'source_commit': os.environ['SOURCE_COMMIT'], 'source_tree': os.environ['SOURCE_TREE'], 'records': records, 'errors': errors, 'changed': changed, 'unexpected': unexpected, 'assets': assets}
                  (output / 'regression-receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
                  print(json.dumps(receipt), flush=True)
              return 1 if errors or changed else 0


          if __name__ == '__main__':
              raise SystemExit(main())
      - name: Retain regression results as draft
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path cloud-output/regression-receipt.json)) { throw 'No completed regression receipt; no results retained' }
          $files = @(Get-ChildItem -LiteralPath cloud-output -File | ForEach-Object { $_.FullName })
          $tag = 'windows-python-probe-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT
          & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --draft --target $env:SOURCE_COMMIT --title ('Windows regression ' + $env:RELEASE_VERSION) --notes 'Verification results only. No installable release or updater change.'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retain regression results' }
