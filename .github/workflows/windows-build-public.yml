name: Public Windows Python contracts
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Public export commit to verify"
        required: true
        type: string
      source_tree:
        description: "Expected public export tree"
        required: true
        type: string
      version:
        description: "Expected application version"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-python-contracts
  cancel-in-progress: false
jobs:
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -ne '009d1c28f9e9d6be65a2bab55283cb87ad9b76b9') { throw 'Invalid source commit' }
          if ($env:SOURCE_TREE -ne '3009534310c2b6f0e0abff9c9b55120b471b3f8b') { throw 'Invalid source tree' }
          if ($env:RELEASE_VERSION -ne '0.89.0') { throw 'Unexpected version' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Cannot configure checkout line endings' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify fixed source and RAM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_COMMIT) { throw 'Source mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:SOURCE_TREE) { throw 'Tree mismatch' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $env:RELEASE_VERSION) { throw 'Version mismatch' }
          $freeRam = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Output ("Free RAM: {0:N2} GiB" -f $freeRam)
          if ($freeRam -lt 5.2) { throw 'Runner RAM gate failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Restore locked Node dependencies
        shell: pwsh
        run: npm ci
      - name: Install approved pinned test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Approved test dependencies unavailable' }
      - name: Verify frontend and available Python contracts
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess, sys, time
          import pytest, openpyxl
          assert pytest.__version__ == '9.0.2' and openpyxl.__version__ == '3.1.5'
          root=Path.cwd()
          out=root/'cloud-output'
          out.mkdir(exist_ok=False)
          files=['test_agent_cli_inbox.py', 'test_agent_hook_contract.py', 'test_claude_codex_tab_identity.py', 'test_claude_skills_pack_contract.py', 'test_codex_restore_runtime.py', 'test_cursor_launcher.py', 'test_grok_handoff_runtime.py', 'test_hook_settings_merge_contract.py', 'test_launcher_catalog_contract.py', 'test_launcher_codex_pane_env.py', 'test_launcher_grokbot_app.py', 'test_launcher_handoff_env.py', 'test_launcher_restore_auto_contract.py', 'test_launcher_terminal_shell.py', 'test_public_export.py', 'test_terminal_interactive_boot.py', 'test_updater_feed_contract.py']
          records=[]
          failures=[]
          environment=dict(os.environ, SHELL='/usr/bin/bash', PYTHONDONTWRITEBYTECODE='1', PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', PYTHONUTF8='1')
          environment['PATH']='C:/Program Files/Git/usr/bin'+os.pathsep+environment['PATH']
          for locale in ['default','C']:
              child=dict(environment)
              if locale=='C': child['LC_ALL']='C'
              else: child.pop('LC_ALL',None)
              command=[sys.executable,'-B','-X','utf8','-m','pytest',*['tests/'+name for name in files],'-q','-p','no:cacheprovider','--junitxml='+str(out/(locale+'.xml'))]
              started=time.monotonic()
              with (out/(locale+'.log')).open('xb') as log:
                  result=subprocess.run(command,cwd=root,env=child,stdout=log,stderr=subprocess.STDOUT,timeout=1500)
              records.append({'locale':locale,'exit':result.returncode,'seconds':round(time.monotonic()-started,3)})
              if result.returncode: failures.append(locale)
          changed=subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          unexpected=[name for name in untracked if name and not name.startswith('cloud-output/')]
          if changed or unexpected: failures.append('source-invariance')
          assets=[{'name':path.name,'size':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(out.iterdir()) if path.is_file()]
          receipt={'source_commit':os.environ['SOURCE_COMMIT'],'source_tree':os.environ['SOURCE_TREE'],'version':os.environ['RELEASE_VERSION'],'files':files,'checks':records,'failed_checks':failures,'changed_paths':changed,'unexpected_untracked':unexpected,'python_version':sys.version,'pytest':pytest.__version__,'openpyxl':openpyxl.__version__,'assets':assets}
          (out/'regression-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt),flush=True)
          raise SystemExit(1 if failures else 0)
      - name: Retain regression results as draft
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path cloud-output/regression-receipt.json)) { throw 'No completed regression receipt; no results retained' }
          $files = @(Get-ChildItem -LiteralPath cloud-output -File | ForEach-Object { $_.FullName })
          $tag = 'windows-python-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT
          & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --draft --target $env:SOURCE_COMMIT --title ('Windows regression ' + $env:RELEASE_VERSION) --notes 'Verification results only. No installable release or updater change.'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retain regression results' }
