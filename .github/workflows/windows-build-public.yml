name: Public Windows hidden smoke
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Frozen public source commit"
        required: true
        type: string
      source_tree:
        description: "Frozen public source tree"
        required: true
        type: string
      version:
        description: "Expected application version"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-hidden-smoke
  cancel-in-progress: false
jobs:
  hidden-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -ne 'ef72c0672d5a3a78685e7eab9511f07ddcca8892') { throw 'Unexpected source' }
          if ($env:SOURCE_TREE -ne 'e3ecd9d24c153471345dcdeef60d1945171510fc') { throw 'Unexpected tree' }
          if ($env:RELEASE_VERSION -ne '0.88.6') { throw 'Unexpected version' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Cannot set checkout line endings' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-control
          persist-credentials: false
      - name: Download and verify exact distribution executable
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess
          root=Path.cwd()
          out=root/'download-records'
          out.mkdir(exist_ok=False)
          target=root/'binary-input'
          target.mkdir(exist_ok=False)
          repo='miyafcos/mycmux-team'
          release=json.loads(subprocess.check_output(['gh','release','view','windows-build-39564338446','--repo',repo,'--json','assets,isDraft,targetCommitish,tagName']))
          assert release['isDraft'] and release['targetCommitish']==os.environ['SOURCE_COMMIT']
          wanted={'mycmux.exe','cloud-build-receipt.json'}
          selected={row['name']:row for row in release['assets'] if row['name'] in wanted}
          assert set(selected)==wanted
          for name in sorted(wanted):
              subprocess.run(['gh','release','download',release['tagName'],'--repo',repo,'--pattern',name,'--dir',str(target)],check=True)
              path=target/name
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert selected[name]['digest']=='sha256:'+digest and selected[name]['size']==path.stat().st_size
          cloud=json.loads((target/'cloud-build-receipt.json').read_text(encoding='utf-8-sig'))
          assert cloud['public_source_commit']==os.environ['SOURCE_COMMIT']
          assert cloud['public_source_tree']==os.environ['SOURCE_TREE'] and cloud['version']==os.environ['RELEASE_VERSION']
          binary=target/'mycmux.exe'
          assert binary.stat().st_size==77128704
          assert hashlib.sha256(binary.read_bytes()).hexdigest()=='7a030f48a64fc7242d3e20cb04afc89ad3d8240cc35939d28b4636631466bf6f'
          version=subprocess.check_output(['powershell.exe','-NoProfile','-Command',"(Get-Item -LiteralPath '"+str(binary)+"').VersionInfo.ProductVersion"],text=True).strip()
          assert version=='0.88.6'
          record={'public_source':os.environ['SOURCE_COMMIT'],'public_tree':os.environ['SOURCE_TREE'],'version':version,'exe_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'exe_size':binary.stat().st_size,'build_run':39564338446,'ci_control':os.environ['GITHUB_SHA']}
          (out/'download-receipt.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          print('EXACT_BINARY_VERIFIED',version)
      - name: Run distribution binary on isolated desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -I -X utf8 ci-control/.github/ci/hidden_smoke_0886.py --exe binary-input/mycmux.exe --out smoke-output 2>&1 | Tee-Object -FilePath hidden-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Hidden smoke did not pass' }
      - name: Retain smoke receipts without profile secrets
        if: ${{ always() }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess
          root=Path.cwd()
          paths=[root/'download-records/download-receipt.json',root/'hidden-smoke.log',root/'smoke-output/smoke-receipt.json']
          files=[path for path in paths if path.is_file()]
          assert files,'No smoke evidence was created'
          for path in files:
              if path.stat().st_size==0: path.write_text('[no output]\n',encoding='utf-8')
          receipt=root/'smoke-artifact-manifest.json'
          receipt.write_text(json.dumps({'source':os.environ['SOURCE_COMMIT'],'files':[{'name':path.name,'size':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in files],'profile_contents_uploaded':False},indent=2)+'\n',encoding='utf-8')
          tag='windows-hidden-smoke-'+os.environ['GITHUB_RUN_ID']
          subprocess.run(['gh','release','create',tag,*map(str,files),str(receipt),'--repo','miyafcos/mycmux-team','--draft','--target',os.environ['SOURCE_COMMIT'],'--title','Windows hidden smoke 0.88.6','--notes','Isolated verification receipts only. No profile tokens, transcripts, installer changes or updater publication.'],check=True)
