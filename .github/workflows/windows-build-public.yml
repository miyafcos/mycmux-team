name: Public Windows version comparison
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Frozen public candidate source"
        required: true
        type: string
      source_tree:
        description: "Frozen public candidate tree"
        required: true
        type: string
      version:
        description: "Candidate version"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-hidden-identity
  cancel-in-progress: false
jobs:
  hidden-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ['0.88.5', '0.88.6']
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_VERSION: ${{ inputs.version }}
      PROBE_VERSION: ${{ matrix.version }}
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -ne 'ef72c0672d5a3a78685e7eab9511f07ddcca8892') { throw 'Unexpected source' }
          if ($env:SOURCE_TREE -ne 'e3ecd9d24c153471345dcdeef60d1945171510fc') { throw 'Unexpected tree' }
          if ($env:RELEASE_VERSION -ne '0.88.6') { throw 'Unexpected version' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Cannot set checkout line endings' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-control
          persist-credentials: false
      - name: Download and verify fixed old or new distribution
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess
          root=Path.cwd()
          out=root/'download-records'
          out.mkdir(exist_ok=False)
          target=root/'binary-input'
          target.mkdir(exist_ok=False)
          repo='miyafcos/mycmux-team'
          version=os.environ['PROBE_VERSION']
          definitions={
              '0.88.5':('windows-build-39225333970','16ad5e480c0ae539f2b22732e872925d78e357ae','09650ce59931f87efebf0acc634e215686ff9381',75944448,'87dff21cc99029708cea4428412c58d8e0fa7b8d02a91239dc01b4bc50d858aa'),
              '0.88.6':('windows-build-39564338446','ef72c0672d5a3a78685e7eab9511f07ddcca8892','e3ecd9d24c153471345dcdeef60d1945171510fc',77128704,'7a030f48a64fc7242d3e20cb04afc89ad3d8240cc35939d28b4636631466bf6f'),
          }
          tag,source,tree,size,sha=definitions[version]
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','assets,isDraft,targetCommitish,tagName']))
          assert release['isDraft'] and release['targetCommitish']==source
          wanted={'mycmux.exe','cloud-build-receipt.json'}
          selected={row['name']:row for row in release['assets'] if row['name'] in wanted}
          assert set(selected)==wanted
          for name in sorted(wanted):
              subprocess.run(['gh','release','download',tag,'--repo',repo,'--pattern',name,'--dir',str(target)],check=True)
              path=target/name
              assert selected[name]['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest() and selected[name]['size']==path.stat().st_size
          cloud=json.loads((target/'cloud-build-receipt.json').read_text(encoding='utf-8-sig'))
          assert cloud['public_source_commit']==source and cloud['public_source_tree']==tree and cloud['version']==version
          binary=target/'mycmux.exe'
          assert binary.stat().st_size==size and hashlib.sha256(binary.read_bytes()).hexdigest()==sha
          actual=subprocess.check_output(['powershell.exe','-NoProfile','-Command',"(Get-Item -LiteralPath '"+str(binary)+"').VersionInfo.ProductVersion"],text=True).strip()
          assert actual==version
          record={'public_source':source,'public_tree':tree,'version':version,'exe_sha256':sha,'exe_size':size,'ci_control':os.environ['GITHUB_SHA']}
          (out/'download-receipt.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          print('EXACT_BINARY_VERIFIED',version)
      - name: Confirm existing Node diagnostics
        shell: pwsh
        run: |
          node --version
          node -e "if(typeof fetch!=='function'||typeof WebSocket!=='function')process.exit(2)"
          if ($LASTEXITCODE -ne 0) { throw 'Existing Node lacks diagnostics; no installation performed' }
      - name: Run fixed binary on isolated desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -I -X utf8 ci-control/.github/ci/hidden_smoke_0886.py --exe binary-input/mycmux.exe --out smoke-output --probe ci-control/.github/ci/webview_probe_0886.mjs --version $env:PROBE_VERSION 2>&1 | Tee-Object -FilePath hidden-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Hidden comparison did not pass' }
      - name: Retain filtered comparison evidence
        if: ${{ always() }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess
          root=Path.cwd()
          paths=[root/'download-records/download-receipt.json',root/'hidden-smoke.log',root/'smoke-output/smoke-receipt.json',root/'smoke-output/safe-diagnostic.json']
          files=[path for path in paths if path.is_file()]
          assert files,'No smoke evidence was created'
          for path in files:
              if path.stat().st_size==0: path.write_text('[no output]\n',encoding='utf-8')
          receipt=root/'smoke-artifact-manifest.json'
          receipt.write_text(json.dumps({'candidate_source':os.environ['SOURCE_COMMIT'],'probe_version':os.environ['PROBE_VERSION'],'files':[{'name':path.name,'size':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in files],'profile_contents_uploaded':False},indent=2)+'\n',encoding='utf-8')
          tag='windows-hidden-identity-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['PROBE_VERSION']
          subprocess.run(['gh','release','create',tag,*map(str,files),str(receipt),'--repo','miyafcos/mycmux-team','--draft','--target',os.environ['SOURCE_COMMIT'],'--title','Hidden comparison '+os.environ['PROBE_VERSION'],'--notes','Filtered verification receipts. No raw profile, credentials, arguments, production or updater changes.'],check=True)
